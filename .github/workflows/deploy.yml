name: CD - deploy ui-team

on:
  push:
    branches: [preview]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target environment'
        type: choice
        options: [UAT, PROD]
        default: UAT

concurrency:
  group: cd-ui-team-${{ github.event.inputs.target || 'UAT' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      SGP_USER: debian
      SGP_HOST: sgp
      CONTAINER: drumee
      REPO_PATH: /usr/src/drumee/ui-team
      LOG_FILE: /tmp/cd-ui-${{ github.run_id }}.log
    steps:
      - name: Resolve target
        id: target
        run: |
          TARGET="${{ github.event.inputs.target || 'UAT' }}"
          case "$TARGET" in
            PROD) ENV_FILE=production; EP=main;    PUB_PATH=/-/app/ ;;
            UAT)  ENV_FILE=deploy;     EP=preview; PUB_PATH=/-/preview/app/ ;;
            *) echo "Unknown target: $TARGET"; exit 1 ;;
          esac
          echo "env_file=$ENV_FILE" >> "$GITHUB_OUTPUT"
          echo "endpoint=$EP"       >> "$GITHUB_OUTPUT"
          echo "pub_path=$PUB_PATH" >> "$GITHUB_OUTPUT"
          echo "::notice::Target $TARGET -> endpoint $EP"

      - name: Fetch and reset working tree
        id: fetch
        run: |
          OUTPUT=$(ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          cd $REPO_PATH
          PREV=\$(git rev-parse HEAD)
          echo "PREV=\$PREV"
          git fetch origin preview --quiet
          git checkout -f preview --quiet
          git reset --hard origin/preview --quiet
          git clean -fd --quiet >/dev/null 2>&1 || true
          NEW=\$(git rev-parse HEAD)
          echo "NEW=\$NEW"
          EOSSH
          )
          PREV=$(echo "$OUTPUT" | grep '^PREV=' | cut -d= -f2)
          NEW=$(echo "$OUTPUT"  | grep '^NEW='  | cut -d= -f2)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "new=$NEW"   >> "$GITHUB_OUTPUT"
          echo "Previous: ${PREV:0:8}"
          echo "New     : ${NEW:0:8}"

      - name: Deploy
        env:
          ENV_FILE: ${{ steps.target.outputs.env_file }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          cd $REPO_PATH
          if ! npm run deploy -- $ENV_FILE > $LOG_FILE 2>&1; then
            echo "::error::Deploy command failed. Tail of log:"
            tail -50 $LOG_FILE
            exit 1
          fi
          echo "Deploy succeeded"
          EOSSH

      - name: Verify (HTTP + commit head)
        env:
          EP: ${{ steps.target.outputs.endpoint }}
          PUB_PATH: ${{ steps.target.outputs.pub_path }}
          EXPECTED: ${{ steps.fetch.outputs.new }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          VERIFY_URL="https://localhost${PUB_PATH}index.json"
          BODY=\$(curl -sk --max-time 10 -H "Host: app.drumee.org" "\$VERIFY_URL" || echo "")
          HTTP_CODE=\$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 -H "Host: app.drumee.org" "\$VERIFY_URL" || echo 000)
          echo "HTTP code: \$HTTP_CODE"

          if [[ ! "\$HTTP_CODE" =~ ^2[0-9][0-9]\$ ]]; then
            echo "::error::Verify failed: non-2xx for $EP"
            exit 1
          fi

          DEPLOYED=\$(echo "\$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['head'])" 2>/dev/null || echo "")
          EXPECTED_SHORT=\$(echo "$EXPECTED" | cut -c1-8)
          echo "Deployed head: \$DEPLOYED"
          echo "Expected head: \$EXPECTED_SHORT"

          if [ "\$DEPLOYED" != "\$EXPECTED_SHORT" ]; then
            echo "::error::Verify failed: deployed head mismatch"
            exit 1
          fi
          echo "Verified endpoint $EP"
          EOSSH

      - name: Rollback (on failure)
        if: failure() && steps.fetch.outputs.prev != ''
        env:
          ENV_FILE: ${{ steps.target.outputs.env_file }}
          PREV: ${{ steps.fetch.outputs.prev }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -uo pipefail
          cd $REPO_PATH
          echo "::warning::Rolling back to ${PREV:0:8}"
          git reset --hard $PREV --quiet
          if npm run deploy -- $ENV_FILE > $LOG_FILE 2>&1; then
            echo "Rollback succeeded"
          else
            echo "::error::Rollback redeploy ALSO failed. Tail:"
            tail -50 $LOG_FILE
            exit 1
          fi
          EOSSH
