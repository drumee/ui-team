sonar.projectKey=drumee_ui-team
sonar.organization=drumee
sonar.sources=.
sonar.exclusions=node_modules/**,src/vendor/**,dist/**,build/**,icons/**

# javascript:S101 — "Class names should comply with a naming convention"
# (^\$?[A-Z][a-zA-Z0-9]*$).
#
# SUPPRESSED, not fixed, and deliberately: every widget class in this codebase is
# named __snake_case (273 of them; none is PascalCase), and the name is
# LOAD-BEARING rather than cosmetic. The framework derives `fig.family` from it —
# `__activate_workspace` becomes "activate-workspace" — and that family is what
# every CSS class in the widget's skin is built from, plus every selector the
# widget builds at runtime from `this.fig.family`. Renaming one class to satisfy
# the rule would silently detach it from its own stylesheet.
#
# So this is a ruleset/codebase mismatch. Fixing it properly means either
# teaching Sonar this convention or changing the framework's family derivation —
# neither belongs in a feature branch.
sonar.issue.ignore.multicriteria=widgetClassNames
sonar.issue.ignore.multicriteria.widgetClassNames.ruleKey=javascript:S101
sonar.issue.ignore.multicriteria.widgetClassNames.resourceKey=**/*.js
