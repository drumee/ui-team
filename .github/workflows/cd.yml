name: Pilot deploy → drumee.in/-/liam/

on:
  push:
    branches: [ci/setup-deploy]
  workflow_dispatch:

concurrency:
  group: deploy-liam-ui
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, drumee-liam]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Show env
        run: |
          node --version
          npm --version
          whoami
          pwd

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Setup deploy env
        run: npm run setup -- --output=deploy --endpoint=liam --user=liam --build-mode=production

      - name: Webpack build (to /home/liam/build/ui)
        run: npm run deploy

      - name: Rsync atomic to runtime dir
        run: rsync -a --delete /home/liam/build/ui/ /srv/drumee/runtime/ui/liam/

      - name: Restart endpoint
        run: |
          sudo /usr/sbin/drumee restart liam
          sudo /usr/sbin/drumee restart liam/service

      - name: Verify deployed commit matches
        run: |
          sleep 5
          deployed=$(curl -sk https://drumee.in/-/liam/app/index.json \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['head'])")
          local=$(git log -1 --pretty=format:'%h')
          echo "deployed head: $deployed"
          echo "local    head: $local"
          [ "$deployed" = "$local" ] && exit 0 || exit 1
