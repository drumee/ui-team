name: Guard preview source

# Only allow PRs into `preview` when they originate from the `test` branch.
on:
  pull_request:
    branches: [preview]
    types: [opened, synchronize, reopened, edited]

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - name: Only allow merges from 'test'
        run: |
          echo "OK: source branch is 'test'"
