name: CD - deploy ui-team

on:
  push:
    branches: [preview]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target environment"
        type: choice
        options: [UAT, PROD]
        default: UAT

concurrency:
  group: cd-ui-team-${{ github.event.inputs.target || 'UAT' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      SGP_USER: debian
      SGP_HOST: sgp
      CONTAINER: drumee
      REPO_PATH: /usr/src/drumee/ui-team
    steps:
      - name: Resolve target
        id: target
        run: |
          TARGET="${{ github.event.inputs.target || 'UAT' }}"
          case "$TARGET" in
            PROD) ENV_FILE=production; EP=main ;;
            UAT)  ENV_FILE=deploy;     EP=preview ;;
            *) echo "Unknown target: $TARGET"; exit 1 ;;
          esac
          echo "env_file=$ENV_FILE" >> "$GITHUB_OUTPUT"
          echo "endpoint=$EP"       >> "$GITHUB_OUTPUT"
          echo "::notice::Target $TARGET -> npm run deploy $ENV_FILE -> endpoint $EP"

      - name: Pull, deploy, verify, rollback on failure
        env:
          ENV_FILE: ${{ steps.target.outputs.env_file }}
          EP: ${{ steps.target.outputs.endpoint }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          cd $REPO_PATH

          PREV=\$(git rev-parse HEAD)
          echo ">> Previous commit: \$PREV"

          echo ">> Fetching origin/preview and hard-resetting working tree"
          git fetch origin preview
          git checkout -f preview
          git reset --hard origin/preview
          git clean -fd
          echo ">> New commit: \$(git rev-parse HEAD)"

          rollback() {
            echo ">> ROLLBACK: reverting to \$PREV"
            git reset --hard \$PREV
            npm run deploy -- $ENV_FILE || echo ">> WARNING: rollback redeploy also failed"
          }

          echo ">> Running npm run deploy $ENV_FILE"
          if ! npm run deploy -- $ENV_FILE; then
            echo ">> Deploy command failed"
            rollback || true
            exit 1
          fi

          DEST=/srv/drumee/runtime/ui/$EP/app
          echo ">> Verifying \$DEST/index.json"
          if [ ! -f "\$DEST/index.json" ]; then
            echo ">> Build artifact missing: index.json"
            rollback || true
            exit 1
          fi

          PUB_PATH=\$([ "$EP" = "main" ] && echo /-/app/ || echo /-/$EP/app/)
          VERIFY_URL="https://localhost\${PUB_PATH}index.json"
          echo ">> GET \$VERIFY_URL (via local nginx)"
          BODY=\$(curl -sk --max-time 10 -H "Host: app.drumee.org" "\$VERIFY_URL" || echo "")
          HTTP_CODE=\$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 -H "Host: app.drumee.org" "\$VERIFY_URL" || echo 000)
          echo ">> HTTP code: \$HTTP_CODE"
          echo ">> Body: \$BODY"

          if [[ ! "\$HTTP_CODE" =~ ^2[0-9][0-9]\$ ]]; then
            echo ">> Verify failed: non-2xx response"
            rollback || true
            exit 1
          fi

          DEPLOYED_HEAD=\$(echo "\$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['head'])" 2>/dev/null || echo "")
          EXPECTED_HEAD=\$(git rev-parse --short HEAD)
          echo ">> Deployed head: \$DEPLOYED_HEAD"
          echo ">> Expected head: \$EXPECTED_HEAD"

          if [ "\$DEPLOYED_HEAD" != "\$EXPECTED_HEAD" ]; then
            echo ">> Verify failed: deployed head != expected"
            rollback || true
            exit 1
          fi

          echo ">> Deploy verified ($EP @ \$EXPECTED_HEAD)"
          EOSSH
