name: CD - deploy ui-team

on:
  push:
    branches: [preview, test]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target environment"
        type: choice
        options: [UAT, TEST, PROD]
        default: UAT

concurrency:
  # Repo-wide group: all targets share one working tree (container for UAT/PROD,
  # stage host for TEST), so deploys must serialize regardless of target/branch.
  group: cd-ui-team
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      SGP_USER: debian
      SGP_HOST: sgp
      CONTAINER: drumee
      REPO_PATH: /usr/src/drumee/ui-team
      LOG_FILE: /tmp/cd-ui-${{ github.run_id }}.log
    steps:
      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            case "${{ github.ref_name }}" in
              test)    TARGET=TEST ;;
              preview) TARGET=UAT ;;
              *) echo "Unsupported push branch: ${{ github.ref_name }}"; exit 1 ;;
            esac
          else
            TARGET="${{ github.event.inputs.target || 'UAT' }}"
          fi
          # MODE=stage  -> deploy locally on the runner host (drumee.in), endpoint `main` UI
          # MODE=container -> deploy into the prod box (sgp) docker container
          case "$TARGET" in
            PROD) ENV_FILE=production; EP=main;    PUB_PATH=/-/app/;         BRANCH=preview; MODE=container ;;
            TEST) ENV_FILE=deploy;     EP=main;    PUB_PATH=/-/app/;         BRANCH=test;    MODE=stage ;;
            UAT)  ENV_FILE=deploy;     EP=preview; PUB_PATH=/-/preview/app/; BRANCH=preview; MODE=container ;;
            *) echo "Unknown target: $TARGET"; exit 1 ;;
          esac
          echo "env_file=$ENV_FILE" >> "$GITHUB_OUTPUT"
          echo "endpoint=$EP"       >> "$GITHUB_OUTPUT"
          echo "pub_path=$PUB_PATH" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH"     >> "$GITHUB_OUTPUT"
          echo "mode=$MODE"         >> "$GITHUB_OUTPUT"
          echo "::notice::Target $TARGET -> endpoint $EP (branch $BRANCH, mode $MODE)"

      # ---------------- TEST: build + deploy to drumee.in (stage) `main` UI ----------------
      - name: Deploy to stage main (TEST)
        id: stage
        if: steps.target.outputs.mode == 'stage'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_DIR: /usr/src/drumee/ui-team
        run: |
          set -euo pipefail
          AUTH="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          [ -d "$REPO_DIR/.git" ] || sudo git init -q "$REPO_DIR"
          PREV=$(sudo git -C "$REPO_DIR" rev-parse HEAD 2>/dev/null || echo "")
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          sudo git -C "$REPO_DIR" fetch --depth 1 "$AUTH" test
          sudo git -C "$REPO_DIR" checkout -f -B test FETCH_HEAD
          sudo git -C "$REPO_DIR" reset --hard FETCH_HEAD
          sudo git -C "$REPO_DIR" clean -fd -e .dev-tools.rc || true
          NEW=$(sudo git -C "$REPO_DIR" rev-parse --short HEAD)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Building $NEW for stage main UI"
          sudo bash -c "cd '$REPO_DIR' && npm install --no-audit --no-fund"
          sudo bash -c "cd '$REPO_DIR' && npm run deploy -- deploy"
          # reload page server so it serves the new build hash (mirrors container "Start services")
          sudo /usr/sbin/drumee start main
          sudo /usr/sbin/drumee start main/service

      - name: Verify stage main UI (TEST)
        if: steps.target.outputs.mode == 'stage'
        env:
          EXPECTED: ${{ steps.stage.outputs.new }}
        run: |
          set -euo pipefail
          sleep 4
          BODY=$(curl -sk --max-time 10 -H 'Host: drumee.in' https://localhost/-/app/index.json || echo "")
          CODE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 -H 'Host: drumee.in' https://localhost/-/app/index.json || echo 000)
          HEAD=$(echo "$BODY" | python3 -c "import sys,json;print(json.load(sys.stdin).get('head',''))" 2>/dev/null || echo "")
          echo "HTTP=$CODE deployed-head=$HEAD expected=$EXPECTED"
          [[ "$CODE" =~ ^2[0-9][0-9]$ ]] || { echo "::error::stage UI verify non-2xx ($CODE)"; exit 1; }
          { [ -z "$EXPECTED" ] || [ "$HEAD" = "$EXPECTED" ]; } || { echo "::error::stage UI head mismatch"; exit 1; }
          echo "Verified stage main UI"

      - name: Rollback stage (on failure)
        if: failure() && steps.target.outputs.mode == 'stage' && steps.stage.outputs.prev != ''
        env:
          REPO_DIR: /usr/src/drumee/ui-team
          PREV: ${{ steps.stage.outputs.prev }}
        run: |
          set -uo pipefail
          echo "::warning::Rolling back stage main UI to ${PREV:0:8}"
          sudo git -C "$REPO_DIR" reset --hard "$PREV"
          sudo bash -c "cd '$REPO_DIR' && npm run deploy -- deploy" || true

      # ---------------- UAT / PROD: build + deploy into prod box (sgp) container ----------------
      - name: Fetch and reset working tree
        id: fetch
        if: steps.target.outputs.mode == 'container'
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          OUTPUT=$(ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          cd $REPO_PATH
          PREV=\$(git rev-parse HEAD)
          echo "PREV=\$PREV"
          git fetch origin $BRANCH --quiet
          git checkout -f $BRANCH --quiet
          git reset --hard origin/$BRANCH --quiet
          git clean -fd --quiet >/dev/null 2>&1 || true
          NEW=\$(git rev-parse HEAD)
          echo "NEW=\$NEW"
          EOSSH
          )
          PREV=$(echo "$OUTPUT" | grep '^PREV=' | cut -d= -f2)
          NEW=$(echo "$OUTPUT"  | grep '^NEW='  | cut -d= -f2)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "new=$NEW"   >> "$GITHUB_OUTPUT"
          echo "Previous: ${PREV:0:8}"
          echo "New     : ${NEW:0:8}"

      - name: Deploy
        if: steps.target.outputs.mode == 'container'
        env:
          ENV_FILE: ${{ steps.target.outputs.env_file }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          cd $REPO_PATH
          # Reinstall so package.json range + patch-package (postinstall) take effect.
          # The container's node_modules is long-lived and otherwise drifts from
          # package.json (e.g. ui-toolkit stuck at 0.0.20 while it wants ^0.0.22,
          # leaving the OTP patch unapplied). Lockfile is gitignored so `npm ci`
          # isn't possible; plain install reconciles the range and re-runs postinstall.
          if ! npm install --no-audit --no-fund > $LOG_FILE 2>&1; then
            echo "::error::npm install failed. Tail of log:"
            tail -50 $LOG_FILE
            exit 1
          fi
          if ! npm run deploy -- $ENV_FILE >> $LOG_FILE 2>&1; then
            echo "::error::Deploy command failed. Tail of log:"
            tail -50 $LOG_FILE
            exit 1
          fi
          echo "Deploy succeeded"
          EOSSH

      - name: Start services
        if: steps.target.outputs.mode == 'container'
        env:
          EP: ${{ steps.target.outputs.endpoint }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          /usr/sbin/drumee start $EP         >> $LOG_FILE 2>&1
          /usr/sbin/drumee start $EP/service >> $LOG_FILE 2>&1
          echo "drumee start issued for $EP and $EP/service"
          sleep 3
          EOSSH

      - name: Verify (HTTP + commit head)
        if: steps.target.outputs.mode == 'container'
        env:
          EP: ${{ steps.target.outputs.endpoint }}
          PUB_PATH: ${{ steps.target.outputs.pub_path }}
          EXPECTED: ${{ steps.fetch.outputs.new }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          VERIFY_URL="https://localhost${PUB_PATH}index.json"
          BODY=\$(curl -sk --max-time 10 -H "Host: app.drumee.org" "\$VERIFY_URL" || echo "")
          HTTP_CODE=\$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 -H "Host: app.drumee.org" "\$VERIFY_URL" || echo 000)
          echo "HTTP code: \$HTTP_CODE"

          if [[ ! "\$HTTP_CODE" =~ ^2[0-9][0-9]\$ ]]; then
            echo "::error::Verify failed: non-2xx for $EP"
            exit 1
          fi

          DEPLOYED=\$(echo "\$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['head'])" 2>/dev/null || echo "")
          EXPECTED_SHORT=\$(echo "$EXPECTED" | cut -c1-8)
          echo "Deployed head: \$DEPLOYED"
          echo "Expected head: \$EXPECTED_SHORT"

          if [ "\$DEPLOYED" != "\$EXPECTED_SHORT" ]; then
            echo "::error::Verify failed: deployed head mismatch"
            exit 1
          fi
          echo "Verified endpoint $EP"
          EOSSH

      - name: Rollback (on failure)
        if: failure() && steps.target.outputs.mode == 'container' && steps.fetch.outputs.prev != ''
        env:
          ENV_FILE: ${{ steps.target.outputs.env_file }}
          PREV: ${{ steps.fetch.outputs.prev }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -uo pipefail
          cd $REPO_PATH
          echo "::warning::Rolling back to ${PREV:0:8}"
          git reset --hard $PREV --quiet
          npm install --no-audit --no-fund > $LOG_FILE 2>&1 || true
          if npm run deploy -- $ENV_FILE >> $LOG_FILE 2>&1; then
            echo "Rollback succeeded"
          else
            echo "::error::Rollback redeploy ALSO failed. Tail:"
            tail -50 $LOG_FILE
            exit 1
          fi
          EOSSH
